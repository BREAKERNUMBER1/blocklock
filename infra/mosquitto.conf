# Mosquitto MQTT Broker Configuration — BlockLock
# Place at: /etc/mosquitto/mosquitto.conf on your DigitalOcean server

# --- Standard unencrypted listener (local only, for testing) ---
listener 1883 127.0.0.1
allow_anonymous false

# --- TLS listener (for ESP32 and external connections) ---
listener 8883
allow_anonymous false

# TLS certificates (generated by Let's Encrypt via certbot)
# Replace YOUR_DOMAIN with your actual domain name
cafile   /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem
certfile /etc/letsencrypt/live/YOUR_DOMAIN/cert.pem
keyfile  /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem

tls_version tlsv1.2

# --- Authentication ---
password_file /etc/mosquitto/passwd

# --- Persistence ---
persistence true
persistence_location /var/lib/mosquitto/

# --- Logging ---
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type information
log_timestamp true

# --- Connection limits ---
max_connections 50
max_inflight_messages 20
